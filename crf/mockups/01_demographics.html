<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM — IMM-PSO-3001 eCRF</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f4f6f8; font-family:-apple-system,"Segoe UI",sans-serif; }
  .study-bar { background:#0b3d91; color:#fff; padding:.6rem 1rem; }
  .study-bar .study-id { font-weight:600; letter-spacing:.04em; }
  .study-bar .form-name { float:right; opacity:.9; }
  .ecrf-card { max-width:880px; margin:1.5rem auto; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .cdash-tag { font-size:.72rem; color:#7f8c8d; margin-left:.3rem; }
  .req { color:#c0392b; font-weight:700; }
  .form-section-title { color:#0b3d91; border-bottom:1px solid #e1e6ed; padding-bottom:.3rem; margin-top:1rem; }
  .footer-actions { background:#f8f9fa; padding:.8rem 1rem; border-top:1px solid #e1e6ed; }
</style>
</head>
<body>

<div class="study-bar">
  <span class="study-id">IMM-PSO-3001</span>
  <span class="form-name">Form: Demographics (DM)</span>
</div>

<div class="card ecrf-card">
  <div class="card-body">
    <h4 class="mb-3">Demographics</h4>
    <p class="text-muted small">CDASH Domain: DM &middot; Visit: Screening &middot; Required fields marked <span class="req">*</span></p>

    <h6 class="form-section-title">Subject identification</h6>
    <div class="mb-3">
      <label class="form-label">Subject ID <span class="req">*</span><span class="cdash-tag">[CDASH: SUBJID]</span></label>
      <input type="text" class="form-control" placeholder="S###-####" value="S001-0014">
      <div class="form-text">Format: S followed by 3-digit site number, dash, 4-digit subject number.</div>
    </div>

    <h6 class="form-section-title">Demographics</h6>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Date of birth <span class="req">*</span><span class="cdash-tag">[BRTHDAT]</span></label>
        <input type="date" class="form-control" value="1976-08-12">
      </div>
      <div class="col-md-2">
        <label class="form-label">Age <span class="req">*</span><span class="cdash-tag">[AGE]</span></label>
        <input type="number" class="form-control" value="49" readonly>
        <div class="form-text">Computed</div>
      </div>
      <div class="col-md-2">
        <label class="form-label">Units<span class="cdash-tag">[AGEU]</span></label>
        <select class="form-select"><option>YEARS</option><option>MONTHS</option></select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Sex <span class="req">*</span><span class="cdash-tag">[SEX]</span></label>
        <div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sex" id="sexM" checked>
            <label class="form-check-label" for="sexM">M</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sex" id="sexF">
            <label class="form-check-label" for="sexF">F</label>
          </div>
        </div>
      </div>
    </div>

    <h6 class="form-section-title">Race &amp; ethnicity</h6>
    <div class="mb-3">
      <label class="form-label">Race <span class="req">*</span><span class="cdash-tag">[RACE]</span></label>
      <div class="form-text mb-2">Check all that apply.</div>
      <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">White</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Black or African American</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Asian</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">American Indian or Alaska Native</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Native Hawaiian or Other Pacific Islander</label></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Ethnicity <span class="req">*</span><span class="cdash-tag">[ETHNIC]</span></label>
      <select class="form-select">
        <option>Not Hispanic or Latino</option>
        <option>Hispanic or Latino</option>
        <option>Not Reported</option>
        <option>Unknown</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Country <span class="req">*</span><span class="cdash-tag">[COUNTRY]</span></label>
      <select class="form-select"><option>USA</option></select>
    </div>
  </div>

  <div class="footer-actions text-end">
    <button class="btn btn-outline-secondary">Save</button>
    <button class="btn btn-primary ms-2">Save &amp; Continue</button>
  </div>
</div>

</body>
</html>
