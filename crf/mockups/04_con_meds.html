<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CM — IMM-PSO-3001 eCRF</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{background:#f4f6f8;font-family:-apple-system,"Segoe UI",sans-serif}
  .study-bar{background:#0b3d91;color:#fff;padding:.6rem 1rem}
  .study-bar .study-id{font-weight:600;letter-spacing:.04em}
  .study-bar .form-name{float:right;opacity:.9}
  .ecrf-card{max-width:880px;margin:1.5rem auto;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .cdash-tag{font-size:.72rem;color:#7f8c8d;margin-left:.3rem}
  .req{color:#c0392b;font-weight:700}
  .form-section-title{color:#0b3d91;border-bottom:1px solid #e1e6ed;padding-bottom:.3rem;margin-top:1rem}
  .footer-actions{background:#f8f9fa;padding:.8rem 1rem;border-top:1px solid #e1e6ed}
</style>
</head>
<body>

<div class="study-bar">
  <span class="study-id">IMM-PSO-3001</span>
  <span class="form-name">Form: Concomitant Medications (CM)</span>
</div>

<div class="card ecrf-card">
  <div class="card-body">
    <h4 class="mb-3">Concomitant Medication</h4>
    <p class="text-muted small">CDASH Domain: CM &middot; Visit: All &middot; One row per medication.</p>

    <div class="mb-3">
      <label class="form-label">Medication name <span class="req">*</span><span class="cdash-tag">[CMTRT]</span></label>
      <input type="text" class="form-control" value="methotrexate">
      <div class="form-text">Verbatim; coded post-entry to WHO Drug Dictionary.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Indication <span class="req">*</span><span class="cdash-tag">[CMINDC]</span></label>
      <input type="text" class="form-control" value="Psoriasis maintenance">
    </div>

    <h6 class="form-section-title">Dose</h6>
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Dose <span class="req">*</span><span class="cdash-tag">[CMDOSE]</span></label>
        <input type="number" class="form-control" value="15">
      </div>
      <div class="col-md-3">
        <label class="form-label">Unit <span class="req">*</span><span class="cdash-tag">[CMDOSU]</span></label>
        <select class="form-select"><option selected>mg</option><option>g</option><option>mL</option><option>IU</option><option>mcg</option></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Route <span class="req">*</span><span class="cdash-tag">[CMROUTE]</span></label>
        <select class="form-select"><option selected>ORAL</option><option>IV</option><option>IM</option><option>SC</option><option>TOPICAL</option></select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Ongoing at EOS <span class="req">*</span><span class="cdash-tag">[CMONGO]</span></label>
        <select class="form-select"><option selected>Y</option><option>N</option></select>
      </div>
    </div>

    <h6 class="form-section-title">Dates</h6>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Start date <span class="req">*</span><span class="cdash-tag">[CMSTDAT]</span></label>
        <input type="date" class="form-control" value="2024-02-04">
      </div>
      <div class="col-md-6">
        <label class="form-label">End date<span class="cdash-tag">[CMENDAT]</span></label>
        <input type="date" class="form-control" placeholder="leave blank if ongoing">
      </div>
    </div>
  </div>
  <div class="footer-actions text-end">
    <button class="btn btn-outline-secondary">Save</button>
    <button class="btn btn-primary ms-2">Save &amp; Continue</button>
  </div>
</div>
</body>
</html>
